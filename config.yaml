  - name: "SAIC"
    url: "https://jobs.saic.com/search/jobs?location=Washington&location_state=WA&radius=50"
    platform: playwright
    # Filtered to WA via SAIC's own GET query params (verified: "2 Washington
    # jobs found" - Seattle, Spokane). Needs Playwright, not plain requests:
    # SAIC's WAF fingerprints the TLS handshake and blocks python-requests
    # with a 403 even with a full browser User-Agent header, while curl and
    # a real browser both pass - not a header problem, a client-fingerprint one.

